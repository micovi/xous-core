[package]
name = "bao1x-hal-service"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
utralib = { version = "0.1.27", optional = true, default-features = false, features = [
    "bao1x",
] }
xous-names = { package = "xous-api-names", version = "0.9.72" }
ticktimer = { package = "xous-api-ticktimer", version = "0.9.71" }
xous = { version = "0.9.71", features = ["raw-trng"] }
xous-ipc = "0.10.11"
log-server = { package = "xous-api-log", version = "0.1.70" }
log = "0.4.14"
xous-api-susres = { path = "../../api/xous-api-susres", features = ["bao1x"] }
bao1x-hal = { path = "../../libs/bao1x-hal", default-features = false }
bao1x-api = { path = "../../libs/bao1x-api", features = ["derive-rkyv", "std"] }
bio-lib = { path = "../../libs/bio-lib", features = ["av-trng"] }
# I'm not entirely in love with the aborted attempt to use flatipc in Xous, but we use
# this because it makes the API backward-compatible with older Xous code.
flatipc = { path = "../../libs/flatipc" }
flatipc-derive = { path = "../../libs/flatipc-derive" }
rand = "0.8.5"
rand_core = "0.6.4"
rand_chacha = "0.3.1"
bitfield = "0.13.2"
# TODO: migrate from bitfield to bitbybit
bitbybit = "1.4.0"
arbitrary-int = "1.2"
bytemuck = "1.24.0"
chrono = { version = "0.4.33", default-features = false, features = ["std"] }

num-derive = { version = "0.4.2", default-features = false }
num-traits = { version = "0.2.14", default-features = false }
rkyv = { version = "0.8.8", default-features = false, features = [
    "std",
    "alloc",
] }

[features]
keyboard-testing = []
app-uart = []
rawserial = []
pinger = []
swap = []
mpw = ["bao1x-hal/mpw"]
bmp180 = ["bao1x-hal/bmp180"]
board-baosec = ["bao1x-hal/board-baosec"]
board-baosor = ["bao1x-hal/board-baosor"]
board-dabao = ["bao1x-hal/board-dabao"]

accel-kbd = []
oem-baosec-lite = ["bao1x-hal/oem-baosec-lite"]

with-duart = ["bao1x-hal/debug-print-duart"]
# Let a process claim I/O pins and UDMA peripherals; configuration, writes, edge interrupts,
# resets and clock gating of claimed ones from other processes are refused, and the values
# of claimed pins are hidden from them (see bao1x-api). Use with bio-locked: the BIO can
# take any pin.
iox-claims = ["bao1x-api/iox-claims"]
# For an image that runs no BIO code: the HAL service maps the BIO's pages and keeps its
# cores stopped, registers no BIO server, routes no pin to the BIO and refuses ConfigureBio.
bio-locked = []
# For the Dabao image: the HAL service maps at its start, and keeps, the register pages of the
# DMA masters nothing in the image uses (the PL230, the MDMA, the SCE DMA, the SD device
# controller and the UDMA peripherals other than UART2, SPIM2, I2C0 and the ADC), so that no
# other process can point them at memory (see src/mmio_hold.rs). Use with bio-locked.
mmio-hold = []
default = ["app-uart", "utralib"]
